<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Timbre · Administrador (prueba)</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#162b30;background:#f5f7f7}*{box-sizing:border-box}body{max-width:740px;margin:32px auto;padding:0 16px}main{background:white;border:1px solid #d9e1e3;border-radius:18px;padding:24px}h1{margin:0 0 8px}p{color:#50636b}button,input{font:inherit}button{border:0;border-radius:9px;background:#1e5552;color:#fff;padding:11px 14px;cursor:pointer}button:disabled{opacity:.45}input{padding:11px;border-radius:8px;border:1px solid #bccace;min-width:0}#key{width:100%}#chats{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.chat{background:#e7eeee;color:#204440}.chat.active{background:#1e5552;color:white}#messages{background:#f5f8f8;min-height:180px;max-height:340px;overflow:auto;border-radius:10px;padding:10px;margin:12px 0}.message{margin:9px 0;padding:10px;background:#fff;border-radius:9px}.admin{background:#dcedeb;margin-left:16%}form{display:flex;gap:8px}form input{flex:1}#error{color:#aa253a;white-space:pre-wrap}.danger{background:#b33f4c}#panel{display:none}small{color:#6b8085}</style>
</head><body><main><h1>Panel de administración</h1><p>Prueba local. La clave solo se mantiene en memoria mientras está abierta esta pestaña.</p><label for="key">Clave de administración (.dev.vars)</label><input id="key" type="password" autocomplete="off" placeholder="ADMIN_API_KEY"><p><button id="connect">Conectar</button> <button id="refreshChats">Actualizar lista</button></p><p id="error" role="alert"></p><div id="panel"><h2>Conversaciones</h2><div id="chats"></div><section id="chatPanel" style="display:none"><p id="selected"></p><div id="messages" aria-live="polite"></div><form id="sendForm"><input id="text" maxlength="2000" placeholder="Respuesta del responsable" required autocomplete="off"><button>Enviar</button></form><p><button id="delete" class="danger">Eliminar chat seleccionado</button></p></section><small>Actualización cada 2 segundos. No es un panel listo para producción.</small></div></main>
<script>
(() => {
 const $=id=>document.getElementById(id);let key='',selected=null,busy=false;
 const headers=()=>({'X-Admin-Key':key});
 const api=async(url,opts={})=>{const res=await fetch(url,opts);let data;try{data=await res.json()}catch{throw Error('Respuesta no válida')};if(!res.ok)throw Error(data.error||`HTTP ${res.status}`);return data};
 const showError=e=>{$('error').textContent=e?.message||String(e)};
 function renderMessages(messages){const box=$('messages');box.replaceChildren();for(const m of messages){const el=document.createElement('div');el.className='message '+(m.from==='admin'?'admin':'');const who=document.createElement('strong');who.textContent=m.from==='admin'?'Responsable':'Visitante';const body=document.createElement('div');body.textContent=m.text;el.append(who,body);box.append(el)}box.scrollTop=box.scrollHeight;}
 async function refreshList(){if(!key)return;const d=await api('/api/admin/chats',{headers:headers()});$('panel').style.display='block';const box=$('chats');box.replaceChildren();for(const c of d.chats){const btn=document.createElement('button');btn.className='chat'+(selected===c.id?' active':'');btn.textContent=`${c.id.slice(0,8)}… (${c.messageCount})`;btn.onclick=()=>{selected=c.id;$('selected').textContent=`Chat ${selected}`;$('chatPanel').style.display='block';refreshList().then(refreshMessages).catch(showError)};box.append(btn)}if(selected&&!d.chats.some(c=>c.id===selected)){selected=null;$('chatPanel').style.display='none'} }
 async function refreshMessages(){if(!selected)return;const d=await api(`/api/admin/chats/${selected}`,{headers:headers()});renderMessages(d.messages)};
 $('connect').onclick=async()=>{key=$('key').value.trim();if(!key)return;try{await refreshList();$('error').textContent='';$('key').value='';}catch(e){key='';showError(e)}};
 $('refreshChats').onclick=()=>refreshList().catch(showError);
 $('sendForm').onsubmit=async e=>{e.preventDefault();if(!selected)return;const text=$('text').value.trim();if(!text)return;try{await api(`/api/admin/chats/${selected}/messages`,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({text})});$('text').value='';await refreshMessages()}catch(e){showError(e)}};
 $('delete').onclick=async()=>{if(!selected||!confirm('¿Eliminar definitivamente este chat de prueba?'))return;try{await api(`/api/admin/chats/${selected}`,{method:'DELETE',headers:headers()});selected=null;$('chatPanel').style.display='none';await refreshList()}catch(e){showError(e)}};
 setInterval(async()=>{if(document.hidden||!key||busy)return;busy=true;try{await refreshList();await refreshMessages()}catch(e){showError(e)}finally{busy=false}},2000);
})();
</script></body></html>
