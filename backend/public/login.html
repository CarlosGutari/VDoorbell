<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entorno de pruebas · Timbre</title>
<style>body{font-family:system-ui;background:#f4f7f7;color:#172f2e;display:grid;place-items:center;min-height:90vh;margin:0}main{background:white;box-shadow:0 4px 18px #0001;border-radius:18px;padding:28px;max-width:420px;width:85%}input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border-radius:8px;margin-top:12px}input{border:1px solid #b7c9c7}button{background:#1e5552;color:white;border:0;cursor:pointer}#err{color:#a12c36}</style></head><body><main><h1>🔔 Timbre virtual</h1><p>Entorno privado de pruebas. Introduce el código compartido para acceder.</p><form id="f"><input id="code" type="password" required autocomplete="off" placeholder="Código de pruebas"><button>Entrar</button></form><p id="err" role="alert"></p></main><script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='';try{const res=await fetch('/api/test/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value})});if(!res.ok){const d=await res.json();throw Error(d.error||'Error');}location.replace('/index.html')}catch(x){err.textContent=x.message}};
</script></body></html>
